<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#006CFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#006CFF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Pretendard', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 76px;
      letter-spacing: -1px;
    }
  </style>

  <text x="600" y="130" class="title-text" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)">학교폭력예방 OX퀴즈</text>
</svg>